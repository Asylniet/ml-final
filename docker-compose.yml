services:
  mlflow:
    build: ./apps/api
    container_name: ml_mlflow
    command:
      - uv
      - run
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:///mlruns/mlflow.db
      - --default-artifact-root
      - /app/mlruns/artifacts
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
    volumes:
      - ./apps/api/mlruns:/app/mlruns
    ports:
      - "5001:5000"
    restart: unless-stopped

  api:
    build: ./apps/api
    container_name: ml_api
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_PATH=models/model.joblib
    volumes:
      - ./apps/api/src/models:/app/code/models
    ports:
      - "8000:8000"
    depends_on:
      - mlflow
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: ml_frontend
    ports:
      - "3000:80"
    restart: unless-stopped
